# bench 源站的 nginx 反向代理
#
# 约定：TLS 只在 nginx 终结，源站监听 127.0.0.1:8080 明文。
# 前端产物由源站托管（server.static_dir），nginx 只做代理，不在两处分别配缓存头。
#
# 安装：
#   sudo cp deploy/nginx-bench.conf /etc/nginx/sites-available/bench
#   sudo ln -s /etc/nginx/sites-available/bench /etc/nginx/sites-enabled/bench
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d bench.example.com        # 证书与续期单元都由它装好
#
# 把 bench.example.com 全部替换成真实域名后再用。

# ── HTTP：只保留 ACME 校验，其余跳转 HTTPS ─────────────────────────
server {
    listen      80;
    listen      [::]:80;
    server_name bench.example.com;

    # certbot --nginx 会自动往这里插入校验 location；用 webroot 模式时手工放开：
    # location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://$host$request_uri; }
}

# ── HTTPS ──────────────────────────────────────────────────────────
server {
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name bench.example.com;

    # certbot --nginx 会写死这几行路径，续期由它的 systemd timer 负责。
    ssl_certificate     /etc/letsencrypt/live/bench.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bench.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         intermediate;   # 沿用 Mozilla intermediate 套件
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 上传正文上限 8192 码点，CJK 最坏 3 字节/码点 + JSON 转义，64k 足够且能早拒大包。
    client_max_body_size 64k;

    # 源站自己做 gzip（内网链路同样省带宽），这里不重复压缩。
    gzip off;

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;

        # 源站的 server.trusted_proxies 默认只信回环，因此这两个头必须带；
        # 缺了 X-Forwarded-For，全站访客会被并成 127.0.0.1 共用同一个限流桶。
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_send_timeout    15s;
        proxy_read_timeout    15s;

        # 透传源站的 Cache-Control / ETag：nginx 默认就透传这三个头（无需 proxy_pass_header，
        # 那条只对 Date/Server/X-Accel-* 这类默认被隐藏的头生效）。
        # 要防的是在这里另外 add_header/cache 一套，那会让入口 HTML 被兜住、发版“看起来没生效”。
    }
}
