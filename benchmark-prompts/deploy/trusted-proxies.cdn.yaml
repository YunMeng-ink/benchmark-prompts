# CDN 回源网段 → server.trusted_proxies 片段
#
# 用途：源站前面有 CDN 时，nginx 追加的那一跳是 **CDN 节点地址**，不是真实客户端。
# 只有把这些网段也声明为可信，`clientip` 的“从右往左取第一个非可信跳”才会继续左移，
# 取到真实客户端；否则同一 CDN 节点后面的所有访客会共用一个限流桶。
# 见 docs/deployment.md §2.4 与 docs/server.md §4.1。
#
# 语义：**精确覆盖** —— 下面这些网段合计覆盖的地址数，与当初喂进去的节点清单
# 去重后的数量完全相等（818），没有多信任任何一个未列出的地址。
# 代价：CDN 换节点就得重新生成。若要用“整段宽化”换取轮换容忍，跑
#   node scripts/cdn-summarize.mjs <清单> --pad --yaml
# 那会把 IPv4 的信任面从 691 个地址扩到 28160 个（约 40 倍），脚本会把差值报出来。
#
# 重新生成（清单从 CDN 控制台导出，一行一个 IP，IPv4/IPv6 混合都行）：
#   node scripts/cdn-summarize.mjs <清单文件> --yaml > deploy/trusted-proxies.cdn.yaml
# 之后把上面的说明块补回来。
#
# 使用方式：把本文件的条目并进 /data/bench/config.yaml 的 server.trusted_proxies，
# 并**务必保留回环两项**（同机 nginx 那一跳）。填了这个列表就是整体替换默认值。
#
# 有测试钉住本文件可被解析且行为正确：internal/api/clientip_test.go
# TestTrustedProxiesCDNFragment。
