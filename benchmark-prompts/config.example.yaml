# 源站配置示例。字段权威说明见 docs/architecture.md §4。
# 启动： bench-server -config config.example.yaml -dev

server:
  # 常规形态是 nginx 终结 TLS、源站只听回环：生产填 "127.0.0.1:8080"。
  # 这里的 ":8080" 面向本机开发；源站直接暴露到公网时才需要配下面的证书。
  addr: ":8080"
  read_timeout: 10s
  write_timeout: 20s
  tls_cert: ""           # 留空 = 明文 HTTP（与是否 -dev 无关）
  tls_key: ""
  # 源站托管前端产物，CDN 挡在前面缓存；留空 = 只出 API。
  # 部署时改成 /data/bench/web（见 docs/deployment.md §2）。
  static_dir: "./web/dist"
  # 只有**直连对端**落在这里面时才采信 X-Forwarded-For / X-Real-IP。
  # 留空 = 默认仅回环；填了就是整体替换，别漏掉 127.0.0.0/8。
  # 前面还有 CDN 时必须把厂商公布的回源网段一起加进来，否则全站并成一个限流桶；
  # 本仓库交付的归约结果在 deploy/trusted-proxies.cdn.yaml（234 条，精确覆盖）。
  trusted_proxies: ["127.0.0.0/8"]

store:
  path: ./bench.db
  migrate: true

auth:
  readonly_anonymous: true
  max_clock_skew: 300s

ratelimit:
  window: 60s
  anonymous:
    meta: 10
    list: 60
    random: 60
    get: 60
    delta: 5
    keys: 5    # 自助注册：未配置即不限流，别删这行
  authed:
    meta: 60
    list: 300
    random: 300
    get: 300
    delta: 30
    scores: 30
    upload: 10
    keys: 30   # 查看/作废自己的 Key

bandwidth:
  watch_enabled: true    # 带宽看门狗：超阈值时降级 delta/list
  max_mbps: 8.0            # = 源站 10M 套餐 × 0.8；换套餐只改这里，推导见 docs/deployment.md
  degrade: [delta, list]

cors:
  allowed_origins: ["*"] # 生产填前端 CDN 域名

moderation:
  enabled: true
  banned_words_file: ""  # 留空则只做长度/格式校验
  max_prompt_len: 8192